services:
  postgres:
    image: postgres:16-alpine
    container_name: doomsday-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: doomsday_user
      POSTGRES_PASSWORD: doomsday_password
      POSTGRES_DB: doomsday_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - doomsday-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doomsday_user -d doomsday_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doomsday-backend
    restart: unless-stopped
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://doomsday_user:doomsday_password@postgres:5432/doomsday_dev?schema=public
    ports:
      - "3001:3001"
    networks:
      - doomsday-net
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BACKEND_URL: "http://backend:3001"
    container_name: doomsday-frontend
    restart: unless-stopped
    environment:
      PORT: 3000
      BACKEND_URL: "http://backend:3001"
    ports:
      - "3000:3000"
    networks:
      - doomsday-net
    depends_on:
      - backend

networks:
  doomsday-net:
    driver: bridge

volumes:
  postgres_data:
